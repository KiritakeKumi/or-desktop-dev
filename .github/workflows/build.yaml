name: build test

permissions:
  contents: read
  pull-requests: read

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: [ubuntu-latest]
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0
    - name: cache
      id:   cache
      uses: actions/cache@v4
      with:
        path: |
          SPECS/.pbuild
          SPECS/_build.x86_64
        key: ${{ runner.os }}-${{ hashFiles('.github/build/_config') }}
        restore-keys: |
          ${{ runner.os }}-
    - name: Install tools
      run: |
        echo "deb http://download.opensuse.org/repositories/openSUSE:/Tools/xUbuntu_24.04/ /" | sudo tee /etc/apt/sources.list.d/obs.list
        wget -qO - http://download.opensuse.org/repositories/openSUSE:/Tools/xUbuntu_24.04/Release.key | sudo apt-key add -
        sudo apt update && sudo apt install osc obs-build libwww-perl libxml-parser-perl -y
    - name: apply pbuild patch
      run: |
        sudo patch --directory=/usr/lib/build --strip=1 -i $(pwd)/.github/build/pbuild.patch
    - name: Build package(s)
      run: |
        set -euo pipefail
        rm -rf SPECS
        mkdir -p SPECS
        while IFS= read -r dir; do
          cp -a "$dir" "SPECS/"
        done < <(find . \
          -path './.git' -prune -o \
          -path './SPECS' -prune -o \
          -type f -name '*.spec' -printf '%h\n' | sed 's|^\./||' | sort -u)
        cp .github/build/* SPECS
        cd SPECS
        sudo pbuild --vm-type=chroot --preset x86_64 --showlog --root=/tmp/b || (sudo pbuild --preset x86_64 --result && exit 1)
    - uses: actions/upload-artifact@v4
      with:
       name: PR${{ github.event.pull_request.number || github.run_id }}-build-packages-results
       path: SPECS/_build.x86_64
       if-no-files-found: error
