name: Check RemoteAsset

permissions:
  contents: read
  pull-requests: read

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-remoteasset
  cancel-in-progress: true

jobs:
  check_remoteasset:
    runs-on: ubuntu-latest
    steps:
    - name: Install dependencies
      run: |
        sudo apt install -y rpm curl util-linux util-linux-extra

    - uses: actions/checkout@v6
      with:
        fetch-depth: 2

    - name: Find specs with remote assets
      id: find-changed
      run: |
        git ls-files '*.spec' > spec-files

        touch changed-remoteassets

        while IFS= read -r file; do
          [ -f "$file" ] || continue

          echo "::group::Processing $file" >&2
          python3 scripts/remoteassetify.py --unsafe-optional-enosys --dry-run "$file" > remoteassets.tmp
          if [ -s remoteassets.tmp ]; then
            cat remoteassets.tmp >&2
            echo "$file" >> changed-remoteassets
          fi
          echo "::endgroup::" >&2
        done < spec-files

        num_changed="$(wc -l < changed-remoteassets)"
        echo "num=$num_changed" > "$GITHUB_OUTPUT"

        echo "# Specs with remote assets" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        sed -e 's/^/    /' changed-remoteassets >> "$GITHUB_STEP_SUMMARY"
        if [ "$num_changed" -eq 0 ]; then
          echo "*(None)*" >> "$GITHUB_STEP_SUMMARY"
        fi
        echo "" >> "$GITHUB_STEP_SUMMARY"

    - name: Check remote assets
      id: check-changed
      if: steps.find-changed.outputs.num != '0'
      run: |
        touch needs-update changes.diff

        while IFS= read -r file; do
          echo "::group::Processing $file" >&2
          python3 scripts/remoteassetify.py --unsafe-optional-enosys --workflow "$file" >> changes.diff || echo "$file" >> needs-update
          echo "::endgroup::" >&2
        done < changed-remoteassets

        num_needs_update="$(wc -l < needs-update)"
        echo "num=$num_needs_update" > "$GITHUB_OUTPUT"

        echo "# Specs requiring update" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        sed -e 's/^/    /' needs-update >> "$GITHUB_STEP_SUMMARY"
        if [ "$num_needs_update" -eq 0 ]; then
          echo "*(None)*" >> "$GITHUB_STEP_SUMMARY"
        fi
        echo "" >> "$GITHUB_STEP_SUMMARY"

        mv changes.diff "${{ github.event.pull_request.number || github.run_id }}-remoteassets.diff"

    - name: Print patch
      if: steps.check-changed.outputs.num != '0'
      run: |
        echo "# Patch" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo '```diff' >> "$GITHUB_STEP_SUMMARY"
        cat "${{ github.event.pull_request.number || github.run_id }}-remoteassets.diff" >> "$GITHUB_STEP_SUMMARY"
        echo '```' >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"

    - uses: actions/upload-artifact@v7
      if: steps.check-changed.outputs.num != '0'
      with:
       archive: false
       path: ${{ github.event.pull_request.number || github.run_id }}-remoteassets.diff

    - name: Fail if update required
      if: steps.check-changed.outputs.num != '0'
      run: |
        url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        echo "::error::Updates required for some #!RemoteAsset lines. Please see $url"
        exit 1
